[package]
name = "nxmonitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
default = []
hud = ["dep:gpui-kit", "dep:raw-window-handle", "dep:windows", "dep:smol"]

[dependencies]
anyhow = "1"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
gpui-kit = { version = "=0.8.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }
smol = { version = "2", optional = true }
windows = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[[bin]]
name = "nxmonitor"
path = "src/main.rs"

[[bin]]
name = "nxmonitor-hud"
path = "src/bin/hud.rs"
required-features = ["hud"]

[[bin]]
name = "nxmonitor-ui-reference"
path = "src/bin/ui_reference.rs"
required-features = ["hud"]

[[bin]]
name = "nxmonitor-desktop"
path = "src/bin/desktop.rs"
required-features = ["hud"]
